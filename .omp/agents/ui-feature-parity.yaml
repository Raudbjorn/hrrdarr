name: ui-feature-parity
version: "1.0"
description: >
  Svelte UI feature parity for hrrdarr. Implements Calendar, Wanted
  (Missing/Cutoff), Activity (Queue/History/Blocklist), Settings (all
  categories), System (Status/Tasks/Backup/Logs/Updates) pages.
