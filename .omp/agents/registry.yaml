version: "1.0"
project: ultrasonic
description: Agent registry for Ultrasonic PVR - Sonarr parity
agents:
  - name: schema-migration
    file: schema-migration.yaml
    slice: 0
    priority: critical
    parallelizable: false
    depends_on: []
    estimated_weeks: 2
  - name: provider-framework
    file: provider-framework.yaml
    slice: 1
    priority: critical
    parallelizable: false
    depends_on: [schema-migration]
    estimated_weeks: 2
  - name: indexer-torznab
    file: indexer-torznab.yaml
    slice: 1
    priority: high
    parallelizable: true
    depends_on: [provider-framework]
    estimated_weeks: 2
  - name: download-client-qbittorrent
    file: download-client-qbittorrent.yaml
    slice: 1
    priority: high
    parallelizable: true
    depends_on: [provider-framework]
    estimated_weeks: 2
  - name: command-queue-scheduler
    file: command-queue-scheduler.yaml
    slice: 2
    priority: high
    parallelizable: false
    depends_on:
      - schema-migration
      - provider-framework
    estimated_weeks: 2
  - name: search-grab-pipeline
    file: search-grab-pipeline.yaml
    slice: 3
    priority: critical
    parallelizable: false
    depends_on:
      - schema-migration
      - indexer-torznab
      - download-client-qbittorrent
      - command-queue-scheduler
    estimated_weeks: 3
  - name: import-pipeline
    file: import-pipeline.yaml
    slice: 4
    priority: critical
    parallelizable: false
    depends_on:
      - schema-migration
      - search-grab-pipeline
      - command-queue-scheduler
    estimated_weeks: 1
  - name: ui-feature-parity
    file: ui-feature-parity.yaml
    slice: 5
    priority: high
    parallelizable: true
    depends_on:
      - search-grab-pipeline
      - import-pipeline
      - command-queue-scheduler
    estimated_weeks: 4
  - name: horizontal-expansion
    file: horizontal-expansion.yaml
    slice: "5+"
    priority: medium
    parallelizable: true
    depends_on:
      - provider-framework
      - import-pipeline
    estimated_weeks: 10
execution_order:
  critical_path:
    - schema-migration
    - provider-framework
    - command-queue-scheduler
    - search-grab-pipeline
    - import-pipeline
  parallel_groups:
    slice_1_providers:
      - indexer-torznab
      - download-client-qbittorrent
    slice_5_expansion:
      - ui-feature-parity
      - horizontal-expansion
total_critical_path_weeks: 10
total_with_parallel_weeks: 14
key_risks:
  - libSQL migration support unverified
  - Sonarr Parser port (73KB C#) - highest technical risk
  - GPLv3 license boundary - implement from specs, not source
  - File operation atomicity across filesystems
license_notice: >
  Sonarr is GPLv3. Treat as requirements document only.
  Implement from Torznab spec, qBittorrent/SABnzbd API docs,
  observed behavior. Do NOT port C# logic directly.
