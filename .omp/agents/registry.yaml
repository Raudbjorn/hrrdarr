version: "1.0"
project: hrrdarr
description: Agent registry for hrrdarr PVR - Sonarr TV and Radarr movie parity
agents:
  - name: schema-migration
    file: schema-migration.yaml
    slice: 0
    priority: critical
    parallelizable: false
    depends_on: []
  - name: provider-framework
    file: provider-framework.yaml
    slice: 1
    priority: critical
    parallelizable: false
    depends_on: [schema-migration]
  - name: indexer-torznab
    file: indexer-torznab.yaml
    slice: 1
    priority: high
    parallelizable: true
    depends_on: [provider-framework]
  - name: download-client-qbittorrent
    file: download-client-qbittorrent.yaml
    slice: 1
    priority: high
    parallelizable: true
    depends_on: [provider-framework]
  - name: command-queue-scheduler
    file: command-queue-scheduler.yaml
    slice: 2
    priority: high
    parallelizable: false
    depends_on:
      - schema-migration
      - provider-framework
  - name: search-grab-pipeline
    file: search-grab-pipeline.yaml
    slice: 3
    priority: critical
    parallelizable: false
    depends_on:
      - schema-migration
      - indexer-torznab
      - download-client-qbittorrent
      - command-queue-scheduler
  - name: import-pipeline
    file: import-pipeline.yaml
    slice: 4
    priority: critical
    parallelizable: false
    depends_on:
      - schema-migration
      - search-grab-pipeline
      - command-queue-scheduler
  - name: ui-feature-parity
    file: ui-feature-parity.yaml
    slice: 5
    priority: high
    parallelizable: true
    depends_on:
      - search-grab-pipeline
      - import-pipeline
      - command-queue-scheduler
  - name: horizontal-expansion
    file: horizontal-expansion.yaml
    slice: "5+"
    priority: medium
    parallelizable: true
    depends_on:
      - provider-framework
      - import-pipeline
parity_scope: [Sonarr TV, Radarr movies]
authoritative_plan: .do-not-commit/research/hrrdarr-parity-plan.md
execution_order:
  critical_path:
    - schema-migration
    - provider-framework
    - command-queue-scheduler
    - search-grab-pipeline
    - import-pipeline
  parallel_groups:
    slice_1_providers:
      - indexer-torznab
      - download-client-qbittorrent
    slice_5_expansion:
      - ui-feature-parity
      - horizontal-expansion
estimates_status: Re-estimate combined TV and movie scope after contract validation
key_risks:
  - libSQL migration support unverified
  - Independent TV and movie parsing and matching - highest technical risk
  - GPLv3 license boundary - implement from specs, not source
  - File operation atomicity across filesystems
license_notice: >
  Sonarr and Radarr are requirements references only.
  Implement from Torznab spec, qBittorrent/SABnzbd API docs,
  observed behavior. Do NOT port C# logic directly.
