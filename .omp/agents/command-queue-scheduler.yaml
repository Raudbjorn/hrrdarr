name: command-queue-scheduler
version: "1.0"
description: >
  Persistent command queue, scheduler, and TaskManager equivalent for
  hrrdarr. Handles command persistence, priority, retries, concurrency
  control, and scheduled jobs (RSS Sync, Refresh Series, Housekeeping, Backup).
