[package]
name = "hrrdarr"
default-run = "hrrdarr"
version = "0.1.0"
edition = "2024"

[dependencies]
ipnet = "=2.12.2"
fancy-regex = "=0.19.2"
html-escape = { version = "=0.2.15", default-features = false }
icu_normalizer = { version = "=2.3.0", default-features = false, features = ["compiled_data"] }
icu_properties = { version = "=2.3.0", default-features = false, features = ["compiled_data"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "multipart"] }
roxmltree = "=0.21.1"
url = "=2.5.8"
chrono = { version = "=0.4.45", default-features = false, features = ["std", "clock"] }
ring = "0.17.14"
rustix = { version = "=0.38.44", features = ["fs"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libsql = "0.9.30"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "fs", "sync", "time", "io-util"] }
tower-http = { version = "0.6", features = ["fs", "cors"] }
uuid = { version = "1", features = ["v4", "serde"] }
ts-rs = { version = "=12.0.1", features = ["uuid-impl", "no-serde-warnings"] }
